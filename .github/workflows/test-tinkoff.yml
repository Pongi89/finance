name: Tinkoff Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Запускать каждый день в 12:00 UTC

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run Sync Script
        env:
          TINKOFF_TOKEN: ${{ secrets.TINKOFF_TOKEN }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
        run: python sync.py
